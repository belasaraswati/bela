<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belance">
<meta name="theme-color" content="#F6F7F9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Belance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --faint:#94A3B8;
  --line:#E8ECF2; --soft:#F1F4F8; --blue:#2456C7; --blue-soft:#EEF3FD;
  --red:#D14343; --red-soft:#FDF0F0; --green:#1F8A5B; --green-soft:#EAF6F0; --amber:#B7791F;
  --r:18px; --sb:env(safe-area-inset-bottom); --st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--muted);margin-bottom:2px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink)}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.label{font-size:12.5px;color:var(--muted);font-weight:500}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.mid{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.split .v{font-size:14.5px;font-weight:600;margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--green)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:600}
.sec a{font-size:13px;color:var(--blue);font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.green{background:var(--green-soft);color:var(--green)}
.it-main{flex:1;min-width:0}
.it-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-s{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-v{font-weight:600;text-align:right;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.bar i.over{background:var(--red)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(var(--sb) + 8px);display:flex;justify-content:space-around;align-items:center;z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);width:62px}
nav button svg{width:22px;height:22px;stroke:currentColor}
nav button.on{color:var(--blue)}
nav .add{width:52px;height:52px;border-radius:17px;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 16px rgba(36,86,199,.28);margin-top:-6px}
nav .add svg{stroke:#fff;width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;padding:10px 18px calc(var(--sb) + 22px)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:#D5DBE5;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}

/* form */
.seg{display:flex;background:var(--soft);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.amt{display:flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.amt span{font-size:20px;font-weight:600;color:var(--faint)}
.amt input{border:0;outline:0;background:none;font-size:32px;font-weight:700;letter-spacing:-.03em;width:100%}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:none;font-size:15px;appearance:none;-webkit-appearance:none}
.field textarea{resize:none;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{width:100%;padding:15px;border-radius:15px;background:var(--blue);color:#fff;font-weight:600;font-size:15.5px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.magic{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 14px;margin-bottom:14px}
.magic textarea{flex:1;border:0;outline:0;resize:none;font-size:14.5px;min-height:22px;max-height:90px;background:none;padding:6px 0}
.magic button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);flex:none}
.magic button.go{background:var(--blue)}
.magic button svg{width:18px;height:18px;stroke:var(--ink)}
.magic button.go svg{stroke:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--faint);text-align:center;font-weight:500;padding:4px 0}
.cal .d{aspect-ratio:1/1.12;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;position:relative}
.cal .d.x{background:none;border:0}
.cal .d small{font-size:9.5px;color:var(--red);font-weight:600;letter-spacing:-.02em}
.cal .d.today{border-color:var(--blue);color:var(--blue)}
.cal .d.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.cal .d.sel small{color:#fff}
.cal .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:9px;background:var(--amber)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-size:16px;font-weight:600}

/* laporan */
.hscroll{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:14px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .bars{display:flex;gap:3px;align-items:flex-end;height:100%}
.trend .bars i{width:10px;border-radius:5px 5px 2px 2px;background:var(--blue)}
.trend .bars i.in{background:#BFD0F3}
.trend small{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:500;transition:.3s;z-index:60;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.loading{opacity:.55;pointer-events:none}
.setup{padding-top:40px}
.setup .logo{width:64px;height:64px;border-radius:20px;margin-bottom:18px}

.chart{position:relative;margin:12px -2px 2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-size:9.5px;fill:#94A3B8;font-family:Inter,sans-serif}
.chart .yl{position:absolute;right:2px;top:2px;bottom:22px;display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:#A3AEBE;pointer-events:none}
.chart .tip{position:absolute;top:-6px;left:0;min-width:120px;background:var(--ink);color:#fff;border-radius:10px;padding:7px 9px;font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}
.chart .tip b{display:block;font-weight:600;margin-bottom:2px;font-size:11px;color:#CBD5E1}
.chart .tip span{display:block}.chart .tip i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
.delta{font-size:13px;font-weight:600;margin-top:2px}.delta span{color:var(--muted);font-weight:400;margin-left:4px}
.seg.mini{margin:8px 0 0;padding:2px;border-radius:10px}.seg.mini button{padding:5px 2px;font-size:12px;border-radius:8px}
.donutrow{display:flex;align-items:center;gap:16px}
.donut{position:relative;flex:none}.donut svg{width:100%;height:100%}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .dc b{font-size:17px;font-weight:700;letter-spacing:-.02em}.donut .dc small{font-size:11px;color:var(--muted)}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lgi{display:flex;align-items:center;gap:8px;font-size:12.5px}.lgi i{width:9px;height:9px;border-radius:3px;flex:none}
.lgi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.lgi b{font-weight:600;font-size:12.5px}
.gbars{display:flex;align-items:flex-end;gap:6px;margin-top:14px}
.gb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;border-radius:9px;padding-top:4px}
.gb.on{background:var(--blue-soft)}
.gbb{display:flex;gap:2px;align-items:flex-end;height:calc(100% - 20px);width:100%;justify-content:center}
.gbb i{width:42%;max-width:12px;border-radius:4px 4px 2px 2px}
.gb small{font-size:10.5px;color:var(--muted)}.gb.on small{color:var(--blue);font-weight:600}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;gap:2px;margin:12px 0 14px}.stack i{display:block;height:100%}
.sankey{width:100%;height:auto;display:block}.sankey .sk{font-size:10px;fill:#0F172A;font-family:Inter,sans-serif;font-weight:500;paint-order:stroke;stroke:#fff;stroke-width:3px}
.toggle{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin:14px 2px 0;cursor:pointer}
.toggle small{color:var(--faint)}
.sw{width:36px;height:22px;border-radius:99px;background:#D5DBE5;position:relative;flex:none;transition:.2s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw.on{background:var(--blue)}.sw.on i{left:16px}
.sw2{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:1px}
.spark{width:90px;height:28px;flex:none}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.search svg{width:18px;height:18px;stroke:var(--muted);flex:none}.search input{flex:1;border:0;outline:0;background:none;font-size:15px}
.fsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:500;flex:none}
.fsel.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sec.small{margin:18px 2px 8px}.sec.small h2{font-size:13px;color:var(--muted);font-weight:500}
.cal .d.l1{background:#EEF3FD;border-color:#E1E9FB}.cal .d.l2{background:#D3E0FA;border-color:#C6D6F8}
.cal .d.l3{background:#9FBCF7;border-color:#9FBCF7}.cal .d.l4{background:#4F7BE0;border-color:#4F7BE0;color:#fff}
.cal .d.l3 small,.cal .d.l4 small{color:inherit}.cal .d.l4 small{color:#fff}
.cal .d small{color:var(--muted)}
.legend .heat{display:inline-flex;gap:3px}.legend .heat i{width:12px;height:12px;border-radius:4px;margin:0}
.heat .l1{background:#EEF3FD}.heat .l2{background:#D3E0FA}.heat .l3{background:#9FBCF7}.heat .l4{background:#4F7BE0}
.row .card .mid{font-size:17px}
.cal .d.sel{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}.cal .d.sel small{color:#fff!important}

/* v3: lebih ringkas */
html,body{font-size:14px}
#app{padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 92px)}
.top{margin-bottom:14px}.top h1{font-size:20px}.top .sub{font-size:12px}
.card{padding:15px 16px;border-radius:16px;margin-bottom:10px}
.label{font-size:11.5px}
.big{font-size:25px;margin:3px 0 1px}
.mid{font-size:16px;margin-top:2px}.mid2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.split{margin-top:12px;padding-top:11px}.split .v{font-size:13.5px}
.sec{margin:18px 2px 8px}.sec h2{font-size:13.5px}.sec a{font-size:12px}
.item{padding:10px 14px;gap:10px}.it-t{font-size:13.5px}.it-s{font-size:11.5px}.it-v{font-size:13.5px}
.ic{width:32px;height:32px;border-radius:10px;font-size:11px}.ic.sm{width:28px;height:28px;font-size:11px;border-radius:9px}
.hint{font-size:11.5px}
.row .card .mid{font-size:15px}
.chip{padding:7px 11px;font-size:12.5px}.seg button{padding:8px 4px;font-size:12.5px}
.amt input{font-size:28px}.btn{padding:13px;font-size:14.5px}
.cardhead{display:flex;justify-content:space-between;align-items:center}.cardhead a{font-size:12px;color:var(--blue);font-weight:500}
.delta{font-size:12px;margin:0}
.today{display:flex;gap:14px;align-items:center}
.ringwrap{position:relative;width:96px;height:96px;flex:none}.ring{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc small{font-size:10px;color:var(--muted)}.ringc b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.todayinfo{flex:1;min-width:0}
.streaks{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pill.tiny{font-size:10.5px;padding:3px 8px}
.tinyline{font-size:10.5px;color:var(--faint);margin-top:5px}
.goal{margin-top:10px}.goalrow{display:flex;justify-content:space-between;font-size:13px;font-weight:500}.goalrow b{font-weight:700}
.goal .bar{margin:6px 0 4px}
.goal-empty{display:flex;gap:12px;align-items:center;border-style:dashed;cursor:pointer}
.donut .dc b{font-size:14px}.lgi{font-size:11.5px}.lgi b{font-size:11.5px}

.info{font-size:10px;color:var(--faint)}
.btn.sm{width:auto;padding:8px 14px;font-size:12.5px;border-radius:11px;flex:none}
.nudge{border-color:#CFE0FB;background:#F7FAFF}.nrow{display:flex;gap:12px;align-items:center;justify-content:space-between}.nrow>div{flex:1;min-width:0}.nrow+.nrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.aicard{display:flex;align-items:center;gap:10px;cursor:pointer}.chev{color:var(--faint);font-size:20px}
.planset{border-color:#CFE0FB;background:#F7FAFF}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.red{background:var(--red-soft);color:var(--red)}.pill.amber{background:#FDF4E7;color:var(--amber)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" style="display:none">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button data-go="cal"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
  <button class="add" id="addBtn" aria-label="Tambah"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="report"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Laporan</button>
  <button data-go="acc"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Akun</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* ============ util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(n)).toLocaleString('id-ID');
const short = n => { const a = Math.abs(n); const s = n < 0 ? '-' : '';
  if (a >= 1e6) return s + (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',').replace(',0','') + 'jt';
  if (a >= 1e3) return s + Math.round(a/1e3) + 'rb'; return s + a; };
const BLN = ['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'];
const HARI = ['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];
const fdate = iso => { if (!iso) return '-'; const [y,m,d] = iso.split('-'); return +d + ' ' + BLN[+m-1]; };
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

const GROUP = n => /paylater/i.test(n) ? 'Paylater'
  : /bibit|tring|rdn|emas/i.test(n) ? 'Investasi'
  : /^cash$/i.test(n) ? 'Tunai'
  : /gopay|shopeepay|dana|ovo|blu/i.test(n) && !/jago/i.test(n) ? 'E-wallet' : 'Bank';
const IC = { Bank:'blue', 'E-wallet':'green', Investasi:'blue', Paylater:'red', Tunai:'' };
const initials = s => String(s).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '•';
const T = r => ({ tab:r[0], row:r[1], date:r[2], desc:r[3], amt:r[4], cf:r[5], cat:r[6], from:r[7], to:r[8] });

function derived(){
  const tx = S.tx.map(T);
  const per = S.periods.find(p => p.tab === S.curTab) || {};
  const acc = S.accounts;
  const sum = g => acc.filter(a => GROUP(a.name) === g).reduce((s,a)=>s+a.balance,0);
  const liquid = sum('Bank') + sum('E-wallet') + sum('Tunai');
  const invest = sum('Investasi'), pay = sum('Paylater');
  const today = todayISO();
  const cur = tx.filter(t => t.tab === S.curTab);
  const spendCur = cur.filter(t => t.cf === 'Spending').reduce((s,t)=>s+t.amt,0);
  const incCur = cur.filter(t => t.cf === 'Income').reduce((s,t)=>s+t.amt,0);
  const spendToday = tx.filter(t => t.date === today && t.cf === 'Spending').reduce((s,t)=>s+t.amt,0);
  const daysLeft = per.end ? Math.max(1, Math.round((new Date(per.end) - new Date(today)) / 864e5) + 1) : 30;
  return { tx, per, liquid, invest, pay, net: liquid + invest + pay, spendCur, incCur, spendToday, daysLeft, today };
}

function billsBetween(fromISO, toISO){
  const out = []; if (!S.bills) return out;
  let d = new Date(fromISO + 'T12:00'); const end = new Date(toISO + 'T12:00');
  while (d <= end){
    S.bills.forEach(b => { if (+b.day === d.getDate()) out.push({ ...b, date: d.toISOString().slice(0,10) }); });
    d = new Date(d.getTime() + 864e5);
  }
  return out;
}

const PAL = ['#2456C7','#5B82E3','#93B0EE','#1F8A5B','#6CC29A','#B7791F','#E3AE5C','#D14343','#EC9A9A','#7C5CD6','#B9A6F0','#0E7490','#67C3D6','#64748B','#A3AEBE'];

const bigLimit = () => ls.get('hideBig', true) ? 10e6 : Infinity;
const norm = d => String(d || '').toLowerCase().replace(/\(.*?\)/g, '').split(' - ')[0].replace(/\b(qris|payment|go-?food|shopeefood)\b/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function periodStats(tab, D){
  const L = bigLimit();
  const tx = D.tx.filter(t => t.tab === tab && t.amt < L);
  const sp = tx.filter(t => t.cf === 'Spending'), inc = tx.filter(t => t.cf === 'Income');
  const byCat = {}; sp.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amt);
  const bySrc = {}; inc.forEach(t => bySrc[t.cat] = (bySrc[t.cat] || 0) + t.amt);
  const out = sp.reduce((s, t) => s + t.amt, 0), inn = inc.reduce((s, t) => s + t.amt, 0);
  const inv = tx.filter(t => t.cf === 'Invest / Savings').reduce((s, t) => s + t.amt, 0) - tx.filter(t => t.cf === 'Dari Asset / Saving').reduce((s, t) => s + t.amt, 0);
  const p = S.periods.find(x => x.tab === tab) || {};
  const days = p.start && p.end ? Math.round((new Date(p.end) - new Date(p.start)) / 864e5) + 1 : 30;
  return { tab, tx, sp, byCat, bySrc, out, inn, inv, p, days };
}
const tabsWithData = D => S.periods.filter(p => D.tx.some(t => t.tab === p.tab)).map(p => p.tab);

/* saldo per akun per hari, dihitung mundur dari saldo sekarang */
function balanceHistory(D){
  if (balanceHistory._k === S.updated + D.tx.length) return balanceHistory._v;
  const names = S.accounts.map(a => a.name);
  const cur = {}; S.accounts.forEach(a => cur[a.name] = a.balance);
  const byDay = {};
  D.tx.forEach(t => { if (!t.date) return; (byDay[t.date] = byDay[t.date] || []).push(t); });
  const dates = Object.keys(byDay).sort();
  const start = dates[0] || D.today;
  const out = [];   // [{date, bal:{}, net}]
  let d = new Date(D.today + 'T12:00'); const s = new Date(start + 'T12:00');
  const b = { ...cur };
  while (d >= s){
    const iso = d.toISOString().slice(0, 10);
    out.push({ date: iso, bal: { ...b }, net: names.reduce((x, n) => x + b[n], 0) });
    (byDay[iso] || []).forEach(t => { if (t.from in b) b[t.from] += t.amt; if (t.to in b) b[t.to] -= t.amt; });
    d = new Date(d.getTime() - 864e5);
  }
  out.reverse();
  balanceHistory._k = S.updated + D.tx.length; balanceHistory._v = out;
  return out;
}

function insights(D){
  const tabs = tabsWithData(D); const i = tabs.indexOf(S.curTab);
  const cur = periodStats(S.curTab, D), prev = i > 0 ? periodStats(tabs[i - 1], D) : null;
  const res = [];
  // laju belanja vs periode lalu di hari yang sama
  if (prev && cur.p.start){
    const dayIdx = Math.round((new Date(D.today) - new Date(cur.p.start)) / 864e5);
    const lim = new Date(new Date(prev.p.start).getTime() + dayIdx * 864e5).toISOString().slice(0, 10);
    const prevSame = prev.sp.filter(t => t.date <= lim).reduce((s, t) => s + t.amt, 0);
    if (prevSame > 0){ const pct = (cur.out - prevSame) / prevSame * 100;
      res.push({ ic: pct > 0 ? '↑' : '↓', cls: pct > 0 ? 'red' : 'green', t: `${Math.abs(pct).toFixed(0)}% ${pct > 0 ? 'lebih boros' : 'lebih hemat'} dari periode lalu`, s: `di hari ke-${dayIdx + 1}: ${short(cur.out)} vs ${short(prevSame)}` }); }
  }
  // kategori naik paling besar
  if (prev){ let best = null;
    Object.keys(cur.byCat).forEach(c => { const d = cur.byCat[c] - (prev.byCat[c] || 0); if (!best || d > best.d) best = { c, d }; });
    if (best && best.d > 0) res.push({ ic: '◆', cls: '', t: `${best.c} naik ${short(best.d)}`, s: `${short(cur.byCat[best.c])} periode ini, ${short(prev.byCat[best.c] || 0)} periode lalu` }); }
  // hari paling boros (90 hari)
  const since = new Date(new Date(D.today).getTime() - 90 * 864e5).toISOString().slice(0, 10);
  const wd = [0,0,0,0,0,0,0], wn = [0,0,0,0,0,0,0]; const dayTot = {};
  D.tx.filter(t => t.cf === 'Spending' && t.date >= since && t.amt < bigLimit()).forEach(t => dayTot[t.date] = (dayTot[t.date] || 0) + t.amt);
  Object.keys(dayTot).forEach(k => { const w = new Date(k + 'T12:00').getDay(); wd[w] += dayTot[k]; wn[w]++; });
  const avg = wd.map((v, k) => wn[k] ? v / wn[k] : 0); const top = avg.indexOf(Math.max(...avg));
  if (avg[top] > 0) res.push({ ic: '◷', cls: '', t: `${HARI[top]} hari paling boros`, s: `rata-rata ${short(avg[top])} per ${HARI[top]} (90 hari terakhir)` });
  // tempat paling sering
  const freq = {}; D.tx.filter(t => t.cf === 'Spending' && t.date >= since).forEach(t => { const k = norm(t.desc); if (k.length < 3) return; (freq[k] = freq[k] || { n: 0, v: 0 }); freq[k].n++; freq[k].v += t.amt; });
  const f = Object.entries(freq).sort((a, b) => b[1].n - a[1].n)[0];
  if (f && f[1].n > 2) res.push({ ic: '★', cls: '', t: `paling sering: ${f[0]}`, s: `${f[1].n}x dalam 90 hari, total ${short(f[1].v)}` });
  return res;
}

function subscriptions(D){
  const tabs = tabsWithData(D).slice(-4); const g = {};
  D.tx.filter(t => t.cf === 'Spending' && tabs.includes(t.tab)).forEach(t => { const k = norm(t.desc).split(' ').slice(0, 2).join(' '); if (k.length < 3) return;
    (g[k] = g[k] || { tabs: new Set(), amts: [], cat: t.cat, name: t.desc }).tabs.add(t.tab); g[k].amts.push(t.amt); });
  return Object.entries(g).filter(([k, v]) => v.tabs.size >= 3 && ['Hiburan','Internet/kuota','Transfer modal','Other spending','Skin & Body Care'].includes(v.cat))
    .map(([k, v]) => { const avg = v.amts.reduce((a, b) => a + b, 0) / v.tabs.size; const sd = Math.max(...v.amts) / Math.min(...v.amts);
      return { k, name: v.name.split(' - ')[0].split('(')[0].trim(), cat: v.cat, perMonth: avg, n: v.tabs.size, stable: sd < 1.6 }; })
    .filter(x => x.stable).sort((a, b) => b.perMonth - a.perMonth);
}

/* ============ charts (SVG) ============ */
const CH = {}; let chId = 0;
function lineChart(series, opt = {}){
  const id = 'c' + (++chId), W = 340, H = opt.h || 150, P = { l: 4, r: 4, t: 10, b: 20 };
  const all = series.flatMap(s => s.v.filter(v => v != null));
  let mn = Math.min(...all), mx = Math.max(...all); if (opt.zero) mn = Math.min(0, mn); if (mx === mn) { mx += 1; mn -= 1; }
  const pad = (mx - mn) * .12; mx += pad; if (!opt.zero) mn -= pad;
  const n = Math.max(...series.map(s => s.v.length));
  const X = i => P.l + (W - P.l - P.r) * (n <= 1 ? 0 : i / (n - 1)), Y = v => P.t + (H - P.t - P.b) * (1 - (v - mn) / (mx - mn));
  let g = '';
  [0, .5, 1].forEach(k => { const y = P.t + (H - P.t - P.b) * k; g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#EDF0F5" stroke-width="1"/>`; });
  series.forEach((s, si) => {
    const pts = s.v.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean); if (!pts.length) return;
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
    if (si === 0 && !opt.noFill) g += `<path d="${d}L${pts[pts.length - 1][0]},${H - P.b}L${pts[0][0]},${H - P.b}Z" fill="url(#g${id})"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w || 2.2}" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
    if (si === 0) { const p = pts[pts.length - 1]; g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"/>`; }
  });
  (opt.xl || []).forEach(([i, t]) => g += `<text x="${Math.min(W - 12, Math.max(12, X(i)))}" y="${H - 4}" text-anchor="middle" class="ax">${t}</text>`);
  CH[id] = { series, X, Y, n, fmt: opt.fmt || short, lab: opt.lab || (i => i), H, P };
  return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${series[0].c}" stop-opacity=".18"/><stop offset="1" stop-color="${series[0].c}" stop-opacity="0"/></linearGradient></defs>${g}<line class="cur" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="#94A3B8" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>
    <div class="yl"><span>${short(mx)}</span><span>${short(mn)}</span></div></div>`;
}
function bindCharts(){
  document.querySelectorAll('.chart[data-ch]').forEach(el => {
    const c = CH[el.dataset.ch]; if (!c) return; const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cur = el.querySelector('.cur');
    const mv = e => { const r = svg.getBoundingClientRect(); const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * 340;
      let i = Math.round((x - c.P.l) / (340 - c.P.l - 4) * (c.n - 1)); i = Math.max(0, Math.min(c.n - 1, i));
      cur.setAttribute('x1', c.X(i)); cur.setAttribute('x2', c.X(i)); cur.setAttribute('opacity', 1);
      tip.innerHTML = `<b>${c.lab(i)}</b>` + c.series.map(s => s.v[i] == null ? '' : `<span><i style="background:${s.c}"></i>${s.name ? s.name + ' ' : ''}${c.fmt(s.v[i])}</span>`).join('');
      tip.style.opacity = 1; tip.style.left = Math.min(r.width - 120, Math.max(0, c.X(i) / 340 * r.width - 60)) + 'px'; };
    const end = () => { cur.setAttribute('opacity', 0); tip.style.opacity = 0; };
    el.addEventListener('touchstart', mv, { passive: true }); el.addEventListener('touchmove', mv, { passive: true }); el.addEventListener('touchend', end);
    el.addEventListener('mousemove', mv); el.addEventListener('mouseleave', end);
  });
}
function donut(segs, center, sub, size = 150){
  const tot = segs.reduce((s, x) => s + x.v, 0) || 1, R = 60, C = 2 * Math.PI * R; let off = 0;
  const arcs = segs.map(s => { const len = s.v / tot * C; const a = `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${s.c}" stroke-width="18" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return a; }).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg viewBox="0 0 150 150"><circle r="${R}" cx="75" cy="75" fill="none" stroke="#F1F4F8" stroke-width="18"/>${arcs}</svg><div class="dc"><b class="num">${center}</b><small>${sub || ''}</small></div></div>`;
}
function groupedBars(groups, opt = {}){
  const mx = Math.max(1, ...groups.flatMap(g => g.vals.map(v => v.v)));
  return `<div class="gbars" style="height:${opt.h || 130}px">${groups.map(g => `<div class="gb ${g.on ? 'on' : ''}" ${g.click ? `onclick="${g.click}"` : ''}><div class="gbb">${g.vals.map(v => `<i title="${short(v.v)}" style="height:${Math.max(2, v.v / mx * 100)}%;background:${v.c}"></i>`).join('')}</div><small>${g.label}</small></div>`).join('')}</div>`;
}
function stackBar(segs){
  const tot = segs.reduce((s, x) => s + Math.max(0, x.v), 0) || 1;
  return `<div class="stack">${segs.filter(s => s.v > 0).map(s => `<i style="width:${s.v / tot * 100}%;background:${s.c}"></i>`).join('')}</div>`;
}
function sankey(left, right){
  const W = 340, gap = 8, nodeW = 8, minH = 16;
  const tot = Math.max(left.reduce((s, x) => s + x.v, 0), right.reduce((s, x) => s + x.v, 0)) || 1;
  const n = Math.max(left.length, right.length);
  const H = Math.max(220, n * (minH + gap) + 60);
  const place = arr => { const avail = H - gap * (arr.length - 1) - arr.length * minH; let y = 0;
    return arr.map(o => { const h = minH + Math.max(0, o.v / tot * avail); const r = { ...o, y, h, used: 0 }; y += h + gap; return r; }); };
  const L = place(left), R = place(right); let g = '';
  // alokasi berurutan: sumber pertama mengisi tujuan pertama dulu (lebih rapi, minim silang)
  const remL = left.map(x => x.v), remR = right.map(x => x.v); let i = 0, j = 0;
  while (i < L.length && j < R.length){
    const f = Math.min(remL[i], remR[j]);
    if (f > 0){
      const hl = L[i].h * f / L[i].v, hr = R[j].h * f / R[j].v;
      const y0 = L[i].y + L[i].used, y1 = R[j].y + R[j].used; L[i].used += hl; R[j].used += hr;
      const x0 = nodeW, x1 = W - nodeW, mx = W / 2;
      g += `<path d="M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1} L${x1},${y1 + hr} C${mx},${y1 + hr} ${mx},${y0 + hl} ${x0},${y0 + hl}Z" fill="${R[j].c}" opacity=".22"/>`;
    }
    remL[i] -= f; remR[j] -= f; if (remL[i] <= 0.5) i++; if (remR[j] <= 0.5) j++;
  }
  L.forEach(o => g += `<rect x="0" y="${o.y}" width="${nodeW}" height="${o.h}" rx="2" fill="${o.c}"/><text x="${nodeW + 6}" y="${o.y + o.h / 2 + 3.5}" class="sk">${esc(o.label)} · ${short(o.v)}</text>`);
  R.forEach(o => g += `<rect x="${W - nodeW}" y="${o.y}" width="${nodeW}" height="${o.h}" rx="2" fill="${o.c}"/><text x="${W - nodeW - 6}" y="${o.y + o.h / 2 + 3.5}" text-anchor="end" class="sk">${esc(o.label)} · ${short(o.v)}</text>`);
  return `<svg class="sankey" viewBox="0 -4 ${W} ${H + 8}">${g}</svg>`;
}
const legend = segs => `<div class="lg">${segs.map(s => `<div class="lgi" ${s.click ? `onclick="${s.click}"` : ''}><i style="background:${s.c}"></i><span>${esc(s.label)}</span><b class="num">${s.right || short(s.v)}</b></div>`).join('')}</div>`;

function dayJatah(D){
  // jatah harian = (uang siap pakai di awal hari − utang paylater − tagihan tetap s/d gajian) / sisa hari
  const hist = balanceHistory(D); const liquidOf = b => S.accounts.filter(a => ['Bank','E-wallet','Tunai'].includes(GROUP(a.name))).reduce((s, a) => s + (b[a.name] || 0), 0);
  const payOf = b => S.accounts.filter(a => GROUP(a.name) === 'Paylater').reduce((s, a) => s + (b[a.name] || 0), 0);
  const idx = {}; hist.forEach((h, i) => idx[h.date] = i);
  const spendOn = {}; D.tx.forEach(t => { if (t.cf === 'Spending' && t.amt < 10e6) spendOn[t.date] = (spendOn[t.date] || 0) + t.amt; });
  const jatahFor = iso => {
    const i = idx[iso]; if (i == null || i === 0) return null; const b = hist[i - 1].bal;
    const per = S.periods.find(p => p.start && iso >= p.start && iso <= p.end); if (!per) return null;
    const left = Math.round((new Date(per.end) - new Date(iso)) / 864e5) + 1;
    const fixed = billsBetween(iso, per.end).filter(x => !/paylater/i.test(x.name)).reduce((s, x) => s + (+x.amount || 0), 0);
    return Math.max(0, (liquidOf(b) + payOf(b) - fixed) / left);
  };
  const today = jatahFor(D.today);
  // streak hemat: hari berturut-turut (sampai kemarin, + hari ini kalau masih aman) pengeluaran ≤ jatah hari itu
  let hemat = 0; for (let k = 0; k < 400; k++){ const iso = new Date(new Date(D.today + 'T12:00').getTime() - k * 864e5).toISOString().slice(0, 10);

function weekendWeight(D){
  const since = new Date(new Date(D.today).getTime() - 90 * 864e5).toISOString().slice(0, 10); const tot = {};
  D.tx.filter(t => t.cf === 'Spending' && t.date >= since && t.amt < 1e6).forEach(t => tot[t.date] = (tot[t.date] || 0) + t.amt);

function smartJatah(D){

  const fixedBills = (S.bills || []).filter(b => !/paylater/i.test(b.name)).reduce((s, b) => s + (+b.amount || 0), 0);
  const save = P ? P.goals.reduce((s, g) => s + (+g.monthly || 0), 0) : 0;
  const income = P ? +P.income : periodStats(S.curTab, D).inn;
  const pool = income - save - subTot - fixedBills;
  const flex = t => t.cf === 'Spending' && t.tab === S.curTab && t.amt < 10e6 && t.cat !== 'Pernikahan' && !isSub(t);
  const spentBefore = D.tx.filter(t => flex(t) && t.date < D.today).reduce((s, t) => s + t.amt, 0);
  const spentToday = D.tx.filter(t => flex(t) && t.date === D.today).reduce((s, t) => s + t.amt, 0);

  }

  return { jatah, spent: spentToday, pool, income, save, subTot, fixedBills, spentBefore, remaining, ww, limitedByCash,
    weekday: Math.min(base, real), weekend: Math.min(base * ww, real * ww), real };
}

/* ============ KALENDER (heatmap) ============ */
function vCal(){
  const D = derived();
  if (!ui.calMonth) ui.calMonth = D.today.slice(0, 7);
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(); const lead = (first.getDay() + 6) % 7;
  const L = bigLimit(); const spendBy = {};
  D.tx.forEach(t => { if (t.cf === 'Spending' && t.amt < L && t.date.startsWith(ui.calMonth)) spendBy[t.date] = (spendBy[t.date] || 0) + t.amt; });
  const vals = Object.values(spendBy).sort((a, b) => a - b); const q = p => vals.length ? vals[Math.floor((vals.length - 1) * p)] : 0;
  const lvl = v => !v ? 0 : v <= q(.25) ? 1 : v <= q(.5) ? 2 : v <= q(.8) ? 3 : 4;
  const mEnd = ui.calMonth + '-' + String(days).padStart(2, '0');
  const billDays = new Set(billsBetween(ui.calMonth + '-01', mEnd).map(b => b.date));
  const total = Object.values(spendBy).reduce((s, v) => s + v, 0);
  const active = Object.keys(spendBy).length; const noSpend = Math.min(days, Math.max(0, (D.today.startsWith(ui.calMonth) ? +D.today.slice(8) : days))) - active;
  let cells = ['sen','sel','rab','kam','jum','sab','min'].map(h => `<div class="h">${h}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += `<div class="d x"></div>`;
  for (let d = 1; d <= days; d++){
    const iso = ui.calMonth + '-' + String(d).padStart(2, '0');
    cells += `<button class="d l${lvl(spendBy[iso])} ${iso === D.today ? 'today' : ''} ${iso === ui.calSel ? 'sel' : ''}" onclick="ui.calSel='${iso}';vCal()">${billDays.has(iso) ? '<i class="dot"></i>' : ''}<span>${d}</span><small class="num">${spendBy[iso] ? short(spendBy[iso]) : ''}</small></button>`;
  }
  const dayTx = D.tx.filter(t => t.date === ui.calSel).sort((a, b) => b.row - a.row);
  const dayBills = billsBetween(ui.calSel, ui.calSel); const dsel = new Date(ui.calSel + 'T12:00');
  const daySpend = dayTx.filter(t => t.cf === 'Spending').reduce((s, t) => s + t.amt, 0);
  $('#app').innerHTML = `
  <div class="top"><div><div class="sub">pengeluaran per hari</div><h1>Kalender</h1></div><button class="iconbtn" onclick="openHistory()" aria-label="cari"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button></div>
  <div class="row">
    <div class="card"><div class="label">Keluar</div><div class="mid num">${short(total)}</div></div>
    <div class="card"><div class="label">Rata-rata</div><div class="mid num">${short(active ? total / active : 0)}</div></div>
    <div class="card"><div class="label">Tanpa jajan</div><div class="mid num">${Math.max(0, noSpend)} hari</div></div>
  </div>
  <div class="card">
    <div class="calhead"><button class="iconbtn" onclick="calShift(-1)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <b>${BLN[m - 1]} ${y}</b>
      <button class="iconbtn" onclick="calShift(1)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span>hemat</span><span class="heat"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span><span>boros</span><span style="margin-left:auto"><i style="background:var(--amber);border-radius:9px"></i>tagihan</span></div>
  </div>
  <div class="sec"><h2>${HARI[dsel.getDay()]}, ${fdate(ui.calSel)}</h2><span class="label num">keluar ${rp(daySpend)}</span></div>
  ${dayBills.length ? `<div class="list" style="margin-bottom:10px">${dayBills.map(b => `<div class="item"><div class="ic red">!</div><div class="it-main"><div class="it-t">tagihan ${esc(b.name)}</div><div class="it-s">jatuh tempo hari ini</div></div><div class="it-v num">${+b.amount ? short(+b.amount) : ''}</div></div>`).join('')}</div>` : ''}
  <div class="list">${dayTx.map(txItem).join('') || '<div class="empty">tidak ada transaksi</div>'}</div>`;

  const sel = (k, opts, ph) => `<select onchange="HF.${k}=this.value;vHist()" class="fsel ${HF[k] ? 'on' : ''}"><option value="">${ph}</option>${opts.map(o => `<option value="${esc(o[0])}" ${HF[k] === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  $('#app').innerHTML = `
  <div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button><h1>Riwayat</h1></div></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="hq" placeholder="cari: bakso, gina, 25000…" value="${esc(HF.q)}" oninput="HF.q=this.value;clearTimeout(window._hq);window._hq=setTimeout(()=>{vHist();const i=$('#hq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></div>
  <div class="hscroll">
    ${sel('tab', tabs.map(t => [t, 'periode ' + tabLabel(t)]).reverse(), 'semua periode')}
    ${sel('cf', [['Spending', 'keluar'], ['Income', 'masuk'], ['Transfer', 'pindah'], ['Invest / Savings', 'investasi']], 'semua jenis')}
    ${sel('cat', S.lists.spending.concat(S.lists.income).map(c => [c, c.trim()]), 'semua kategori')}
    ${sel('acc', S.accounts.map(a => [a.name, a.name]), 'semua akun')}
  </div>
  <div class="card" style="padding:14px 18px"><div class="split" style="margin:0;padding:0;border:0">
    <div><div class="label">Transaksi</div><div class="v num">${tx.length}</div></div>
    <div><div class="label">Keluar</div><div class="v num">${short(tot)}</div></div>
    <div><div class="label">Masuk</div><div class="v num pos">${short(tin)}</div></div></div></div>
  ${html || '<div class="list"><div class="empty">tidak ketemu</div></div>'}
  ${tx.length > shown.length ? `<button class="btn ghost" style="margin-top:12px" onclick="ui.histN=(ui.histN||120)+150;vHist()">tampilkan lagi</button>` : ''}`;
}

/* ============ sheets / actions ============ */
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function openTx(tab, row){
  const t = derived().tx.find(x => x.tab === tab && x.row === row); if (!t) return;
  openSheet(`<h3>${esc(t.desc || t.cat)}</h3>
    <div class="card"><div class="label">${esc(t.cf)}${t.cat && t.cf!=='Transfer' ? ' · ' + esc(t.cat) : ''}</div><div class="big num">${rp(t.amt)}</div>
    <div class="hint">${fdate(t.date)} · ${esc([t.from, t.to].filter(Boolean).join(' → '))}<br>tab ${t.tab}, baris ${t.row}</div></div>
    <button class="btn" style="margin-bottom:10px" onclick="editTx('${tab}',${row})">edit</button>
    <div class="grid2"><button class="btn ghost" onclick="dupTx('${tab}',${row})">duplikat</button><button class="btn danger" onclick="delTx('${tab}',${row})">hapus</button></div>`);
}
async function delTx(tab, row){
  try { $('#sheet').classList.add('loading'); await api('delete', { tab, row }); S.tx = S.tx.filter(r => !(r[0]===tab && r[1]===row));
    closeSheet(); toast('terhapus'); render(); load(true); }
  catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}
function editTx(tab, row){ const t = derived().tx.find(x => x.tab === tab && x.row === row);
  openAdd({ cashflow:t.cf, category:t.cf==='Transfer'?'':t.cat, amount:t.amt, from:t.from, to:t.to, description:t.desc, date:t.date || todayISO() }, { tab, row }); }
function dupTx(tab, row){ const t = derived().tx.find(x => x.tab === tab && x.row === row);
  openAdd({ cashflow:t.cf, category:t.cat, amount:t.amt, from:t.from, to:t.to, description:t.desc, date:todayISO() }); }

function openAcc(name){
  const a = S.accounts.find(x => x.name === name);
  openSheet(`<h3>${esc(name)}</h3>
    <div class="card"><div class="label">Saldo di catatan</div><div class="big num">${rp(a.balance)}</div></div>
    <div class="field"><label>Saldo asli sekarang (lihat di app bank)</label><input id="real" inputmode="numeric" placeholder="0" oninput="fmtInput(this);recon('${esc(name)}')"></div>
    <div id="reconOut"></div>
    <div class="sec" style="margin-top:6px"><h2>Transaksi akun ini</h2></div>
    <div class="list">${derived().tx.filter(t=>t.from===name||t.to===name).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,12).map(txItem).join('')||'<div class="empty">kosong</div>'}</div>`);
}
function recon(name){
  const a = S.accounts.find(x => x.name === name); const real = parseAmt($('#real').value);
  const diff = real - a.balance; const out = $('#reconOut');
  if (!$('#real').value || Math.abs(diff) < 1) { out.innerHTML = $('#real').value ? '<div class="pill blue" style="margin-bottom:12px">sudah cocok 👌</div>' : ''; return; }
  const minus = diff < 0; const cats = minus ? S.lists.spending : S.lists.income;
  const def = minus ? (cats.includes('Makan/minum') ? 'Makan/minum' : cats[0]) : (cats.includes('Others') ? 'Others' : cats[0]);
  out.innerHTML = `<div class="card"><div class="label">Selisih</div><div class="mid num ${minus?'neg':'pos'}">${rp(diff)}</div>
    <div class="hint">${minus ? 'ada pengeluaran yang belum dicatat' : 'ada pemasukan yang belum dicatat'}. catat sebagai:</div>
    <div class="field" style="margin:10px 0 12px"><label>Kategori</label><select id="rcat">${cats.map(c=>`<option ${c===def?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <button class="btn" onclick="saveRecon('${esc(name)}',${diff})">catat selisih</button></div>`;
}
async function saveRecon(name, diff){
  const minus = diff < 0;
  await saveTx({ date: todayISO(), description: (minus ? 'pengeluaran' : 'pemasukan') + ' tidak tercatat (cocokkan saldo)', amount: Math.abs(diff),
    cashflow: minus ? 'Spending' : 'Income', category: $('#rcat').value, from: minus ? name : '', to: minus ? '' : name });
}

function editBudgets(){
  const B = S.budgets || {};
  openSheet(`<h3>Anggaran per periode gajian</h3><div class="hint" style="margin:-6px 0 12px">kosongkan kalau tidak mau dibatasi</div>
    ${S.lists.spending.map(c=>`<div class="field"><label>${esc(c)}</label><input data-cat="${esc(c)}" inputmode="numeric" placeholder="-" value="${B[c]?(+B[c]).toLocaleString('id-ID'):''}" oninput="fmtInput(this)"></div>`).join('')}
    <button class="btn" onclick="saveBudgets()">simpan</button>`);
}
async function saveBudgets(){
  const b = { __plan: plan() || undefined }; if (!b.__plan) delete b.__plan; document.querySelectorAll('[data-cat]').forEach(i => { const v = parseAmt(i.value); if (v) b[i.dataset.cat] = v; });
  try { await api('saveSettings', { budgets: b }); S.budgets = b; ls.set('state', S); closeSheet(); toast('anggaran tersimpan'); render(); } catch(e){ toast(e.message); }
}
function billRow(b={}){ return `<div class="card bill" style="padding:12px"><div class="grid2"><div class="field" style="margin:0"><label>Nama</label><input class="bn" value="${esc(b.name||'')}" placeholder="mis. iCloud"></div>
    <div class="field" style="margin:0"><label>Tanggal</label><input class="bd" inputmode="numeric" value="${b.day||''}" placeholder="1-31"></div></div>
    <div class="field" style="margin:10px 0 0"><label>Nominal (kosongkan untuk paylater, otomatis dari saldo)</label><input class="ba" inputmode="numeric" value="${+b.amount?(+b.amount).toLocaleString('id-ID'):''}" oninput="fmtInput(this)"></div></div>`; }
function editBills(){
  openSheet(`<h3>Tagihan rutin</h3><div class="hint" style="margin:-6px 0 12px">nama paylater samakan dengan nama akun (SPayLater / GoPayLater)</div><div id="bills">${(S.bills||[]).map(billRow).join('')}</div>
    <button class="btn ghost" style="margin-bottom:10px" onclick="$('#bills').insertAdjacentHTML('beforeend', billRow())">+ tambah tagihan</button>
    <button class="btn" onclick="saveBills()">simpan</button>`);
}
async function saveBills(){
  const bills = [...document.querySelectorAll('.bill')].map(c => { const name = c.querySelector('.bn').value.trim();
    const acc = S.accounts.find(a => a.name.toLowerCase() === name.toLowerCase());
    return { name, day: +c.querySelector('.bd').value, amount: parseAmt(c.querySelector('.ba').value), account: acc ? acc.name : '' }; })
    .filter(b => b.name && b.day >= 1 && b.day <= 31);
  try { await api('saveSettings', { bills }); S.bills = bills; ls.set('state', S); closeSheet(); toast('tagihan tersimpan'); render(); } catch(e){ toast(e.message); }
}
function resetCfg(){ openSheet(`<h3>Koneksi spreadsheet</h3><div class="hint" style="margin:-6px 0 14px">hanya perlu diubah kalau link Apps Script berganti</div>
  <button class="btn danger" onclick="localStorage.clear();location.reload()">putuskan & atur ulang</button>`); }

/* ============ tambah ============ */
const FORM = { cashflow:'Spending', category:'', amount:0, from:'', to:'', date:'', description:'' };
const OTHER_CF = ['Invest / Savings','Dari Asset / Saving','Piutang Baru','Pelunasan Piutang','Cicilan / Utang Baru','Bayar Cicilan / Utang','Financial Goals'];
const CF_LABEL = { 'Invest / Savings':'Nabung / investasi', 'Dari Asset / Saving':'Ambil dari investasi', 'Piutang Baru':'Kasih pinjaman',
  'Pelunasan Piutang':'Pinjaman dibayar balik', 'Cicilan / Utang Baru':'Ngutang / cicilan baru', 'Bayar Cicilan / Utang':'Bayar utang / cicilan', 'Financial Goals':'Nabung ke tabungan' };
const needFrom = cf => ['Spending','Transfer','Invest / Savings','Dari Asset / Saving','Piutang Baru','Bayar Cicilan / Utang','Financial Goals'].includes(cf);
const needTo = cf => ['Income','Transfer','Invest / Savings','Dari Asset / Saving','Pelunasan Piutang','Cicilan / Utang Baru'].includes(cf);
const catsFor = cf => cf === 'Spending' ? S.lists.spending : cf === 'Income' ? S.lists.income
  : cf === 'Invest / Savings' ? S.lists.invest : cf === 'Dari Asset / Saving' ? S.lists.invest.concat(S.lists.sinking) : cf === 'Financial Goals' ? S.lists.sinking : null;
const lastAcc = () => ls.get('lastAcc', 'Bank Jago');

let EDITING = null;
function openAdd(pre, editing){
  EDITING = editing || null;
  Object.assign(FORM, { cashflow:'Spending', category:'', amount:0, from:lastAcc(), to:'', date:todayISO(), description:'' }, pre || {});
  drawAdd();
}
function drawAdd(){
  const cf = FORM.cashflow; const seg = cf==='Spending'?0:cf==='Income'?1:cf==='Transfer'?2:3;
  const cats = catsFor(cf); const accs = S.accounts.map(a=>a.name);
  const opt = (sel) => `<option value="">pilih akun</option>` + accs.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
  openSheet(`<h3>${EDITING ? 'Edit transaksi' : 'Catat transaksi'}</h3>
    <div class="magic"><textarea id="mtext" rows="1" placeholder="ketik aja: makan bakso 25rb pakai jago" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button onclick="$('#file').click()" aria-label="screenshot"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg></button>
      <button class="go" onclick="magic()" aria-label="isi otomatis"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <div class="seg">${['Keluar','Masuk','Pindah','Lainnya'].map((l,i)=>`<button class="${i===seg?'on':''}" onclick="setCf(${i})">${l}</button>`).join('')}</div>
    ${seg===3?`<div class="field"><label>Jenis</label><select onchange="FORM.cashflow=this.value;FORM.category='';drawAdd()">${OTHER_CF.map(c=>`<option value="${c}" ${c===cf?'selected':''}>${CF_LABEL[c]}</option>`).join('')}</select></div>`:''}
    <div class="amt"><span>Rp</span><input id="famt" inputmode="numeric" placeholder="0" value="${FORM.amount?(+FORM.amount).toLocaleString('id-ID'):''}" oninput="fmtInput(this);FORM.amount=parseAmt(this.value)"></div>
    ${cats ? `<div class="chips">${cats.map(c=>`<button class="chip ${c===FORM.category?'on':''}" onclick="FORM.category='${esc(c).replace(/'/g,"\\'")}';drawAdd()">${esc(c)}</button>`).join('')}</div>`
      : cf==='Transfer' ? '' : `<div class="field"><label>${/Piutang/.test(cf)?'Nama peminjam':'Nama utang / cicilan'}</label><input value="${esc(FORM.category)}" oninput="FORM.category=this.value" placeholder="mis. pinjam yuan"></div>`}
    <div class="${needFrom(cf)&&needTo(cf)?'grid2':''}">
      ${needFrom(cf)?`<div class="field"><label>${cf==='Spending'?'Bayar pakai':'Dari'}</label><select onchange="FORM.from=this.value">${opt(FORM.from)}</select></div>`:''}
      ${needTo(cf)?`<div class="field"><label>${cf==='Income'?'Masuk ke':'Ke'}</label><select onchange="FORM.to=this.value">${opt(FORM.to)}</select></div>`:''}
    </div>
    <div class="grid2">
      <div class="field"><label>Tanggal</label><input type="date" value="${FORM.date}" onchange="FORM.date=this.value"></div>
      <div class="field"><label>Keterangan</label><input value="${esc(FORM.description)}" oninput="FORM.description=this.value" placeholder="mis. bakso basuki"></div>
    </div>
    <button class="btn" id="saveBtn" onclick="submitAdd()">${EDITING ? 'simpan perubahan' : 'simpan'}</button>`);
}
function setCf(i){ const map = ['Spending','Income','Transfer', OTHER_CF[0]]; const prev = FORM.cashflow; FORM.cashflow = map[i]; FORM.category='';
  if (map[i]==='Income' && !FORM.to) { FORM.to = FORM.from || lastAcc(); FORM.from=''; }
  if (map[i]==='Spending' && !FORM.from) { FORM.from = FORM.to || lastAcc(); FORM.to=''; }
  if (prev !== FORM.cashflow) drawAdd(); }
function submitAdd(){
  const cf = FORM.cashflow;
  if (!FORM.amount) return toast('isi nominalnya dulu');
  if (catsFor(cf) && !FORM.category) return toast('pilih kategori dulu');
  if (needFrom(cf) && !FORM.from) return toast('pilih akun asal');
  if (needTo(cf) && !FORM.to) return toast('pilih akun tujuan');
  const tx = { ...FORM }; if (!needFrom(cf)) tx.from = ''; if (!needTo(cf)) tx.to = '';
  if (!tx.description) tx.description = tx.category || CF_LABEL[cf] || cf;
  saveTx(tx);
}
async function saveTx(tx){
  const b = $('#saveBtn'); $('#sheet').classList.add('loading');
  try {
    if (EDITING) { await api('delete', EDITING); S.tx = S.tx.filter(r => !(r[0] === EDITING.tab && r[1] === EDITING.row)); EDITING = null; }
    const r = await api('add', { tx });
    if (tx.from) ls.set('lastAcc', tx.from);
    S.tx.push([r.tab, r.row, tx.date, tx.description, +tx.amount, tx.cashflow, tx.cashflow==='Transfer'?' Antar Account':tx.category, tx.from||'', tx.to||'']);
    // update saldo lokal biar langsung kerasa
    S.accounts.forEach(a => { if (a.name === tx.from) { a.balance -= +tx.amount; a.out += +tx.amount; } if (a.name === tx.to) { a.balance += +tx.amount; a.inn += +tx.amount; } });
    ls.set('state', S); closeSheet(); toast('tersimpan ✓ ' + rp(tx.amount)); render(); load(true);
  } catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}

/* isi otomatis: teks / screenshot */
async function magic(){ const text = $('#mtext').value.trim(); if (!text) return toast('ketik dulu ya'); await runParse({ text }); }
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = await shrink(f); await runParse({ image: img, mime: 'image/jpeg' }); };
async function runParse(body){
  $('#sheet').classList.add('loading'); toast('membaca…');
  try { const tx = await api('parse', body); const acc = S.accounts.map(a=>a.name);
    Object.assign(FORM, { cashflow: tx.cashflow || 'Spending', category: tx.category || '', amount: +tx.amount || 0,
      from: acc.includes(tx.from) ? tx.from : (needFrom(tx.cashflow) ? FORM.from : ''), to: acc.includes(tx.to) ? tx.to : '',
      date: tx.date || todayISO(), description: tx.description || '' });
    if (FORM.cashflow==='Transfer') FORM.category=''; drawAdd(); toast('cek dulu, lalu simpan');
  } catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}
function shrink(file){ return new Promise(res => { const img = new Image(); img.onload = () => { const max = 1280; const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  res(c.toDataURL('image/jpeg', .82).split(',')[1]); }; img.src = URL.createObjectURL(file); }); }

function parseAmt(v){ return +String(v||'').replace(/[^0-9]/g,'') || 0; }
function fmtInput(el){ const n = parseAmt(el.value); el.value = n ? n.toLocaleString('id-ID') : ''; }

/* ============ load ============ */
async function load(silent){
  if (loading) return; loading = true; if (!silent) render();
  try { const d = await api('state'); S = d; ls.set('state', S); }
  catch(e){ toast('gagal sinkron: ' + e.message); }
  loading = false; render();
}
function go(v){ view = v; render(); }
document.querySelectorAll('nav [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#addBtn').onclick = () => S ? openAdd() : toast('tunggu data dimuat');
document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG) load(true); });

/* ============ setup awal ============ */
function renderSetup(){
  $('#nav').style.display = 'none';
  const q = new URLSearchParams(location.search);
  $('#app').innerHTML = `<div class="setup"><img class="logo" src="icon-180.png" alt="">
    <h1 style="font-size:26px;font-weight:700;letter-spacing:-.02em">Sambungkan spreadsheet</h1>
    <p class="hint" style="font-size:14px;margin:8px 0 22px">sekali aja. tempel link Apps Script dan kode akses dari panduan.</p>
    <div class="field"><label>Link Apps Script (…/exec)</label><input id="sApi" value="${esc(q.get('api')||'')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label>Kode akses</label><input id="sTok" value="${esc(q.get('k')||'')}" placeholder="bel-…"></div>
    <button class="btn" style="margin-top:8px" onclick="connect()">sambungkan</button></div>`;
}
async function connect(){
  CFG = { api: $('#sApi').value.trim(), token: $('#sTok').value.trim() };
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.api)) { CFG = null; return toast('link harus diakhiri /exec'); }
  try { toast('menyambungkan…'); const d = await api('state'); S = d; ls.set('cfg', CFG); ls.set('state', S); history.replaceState(null,'',location.pathname); toast('tersambung ✓'); render(); }
  catch(e){ CFG = null; toast('gagal: ' + e.message); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render(); if (CFG) load(true);
</script>
</body>
</html>
