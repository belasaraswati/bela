<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bels">
<meta name="theme-color" content="#F6F7F9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Bels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --faint:#94A3B8;
  --line:#E8ECF2; --soft:#F1F4F8; --blue:#2456C7; --blue-soft:#EEF3FD;
  --red:#D14343; --red-soft:#FDF0F0; --green:#1F8A5B; --green-soft:#EAF6F0; --amber:#B7791F;
  --r:18px; --sb:env(safe-area-inset-bottom); --st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--muted);margin-bottom:2px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink)}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.label{font-size:12.5px;color:var(--muted);font-weight:500}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.mid{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.split .v{font-size:14.5px;font-weight:600;margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--green)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:600}
.sec a{font-size:13px;color:var(--blue);font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.green{background:var(--green-soft);color:var(--green)}
.it-main{flex:1;min-width:0}
.it-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-s{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-v{font-weight:600;text-align:right;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.bar i.over{background:var(--red)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(var(--sb) + 8px);display:flex;justify-content:space-around;align-items:center;z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);width:62px}
nav button svg{width:22px;height:22px;stroke:currentColor}
nav button.on{color:var(--blue)}
nav .add{width:52px;height:52px;border-radius:17px;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 16px rgba(36,86,199,.28);margin-top:-6px}
nav .add svg{stroke:#fff;width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;padding:10px 18px calc(var(--sb) + 22px)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:#D5DBE5;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}

/* form */
.seg{display:flex;background:var(--soft);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.amt{display:flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.amt span{font-size:20px;font-weight:600;color:var(--faint)}
.amt input{border:0;outline:0;background:none;font-size:32px;font-weight:700;letter-spacing:-.03em;width:100%}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:none;font-size:15px;appearance:none;-webkit-appearance:none}
.field textarea{resize:none;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{width:100%;padding:15px;border-radius:15px;background:var(--blue);color:#fff;font-weight:600;font-size:15.5px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.magic{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 14px;margin-bottom:14px}
.magic textarea{flex:1;border:0;outline:0;resize:none;font-size:14.5px;min-height:22px;max-height:90px;background:none;padding:6px 0}
.magic button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);flex:none}
.magic button.go{background:var(--blue)}
.magic button svg{width:18px;height:18px;stroke:var(--ink)}
.magic button.go svg{stroke:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--faint);text-align:center;font-weight:500;padding:4px 0}
.cal .d{aspect-ratio:1/1.12;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;position:relative}
.cal .d.x{background:none;border:0}
.cal .d small{font-size:9.5px;color:var(--red);font-weight:600;letter-spacing:-.02em}
.cal .d.today{border-color:var(--blue);color:var(--blue)}
.cal .d.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.cal .d.sel small{color:#fff}
.cal .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:9px;background:var(--amber)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-size:16px;font-weight:600}

/* laporan */
.hscroll{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:14px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .bars{display:flex;gap:3px;align-items:flex-end;height:100%}
.trend .bars i{width:10px;border-radius:5px 5px 2px 2px;background:var(--blue)}
.trend .bars i.in{background:#BFD0F3}
.trend small{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:500;transition:.3s;z-index:60;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.loading{opacity:.55;pointer-events:none}
.setup{padding-top:40px}
.setup .logo{width:64px;height:64px;border-radius:20px;margin-bottom:18px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" style="display:none">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button data-go="cal"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
  <button class="add" id="addBtn" aria-label="Tambah"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="report"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Laporan</button>
  <button data-go="acc"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Akun</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* ============ util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(n)).toLocaleString('id-ID');
const short = n => { const a = Math.abs(n); const s = n < 0 ? '-' : '';
  if (a >= 1e6) return s + (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',').replace(',0','') + 'jt';
  if (a >= 1e3) return s + Math.round(a/1e3) + 'rb'; return s + a; };
const BLN = ['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'];
const HARI = ['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];
const fdate = iso => { if (!iso) return '-'; const [y,m,d] = iso.split('-'); return +d + ' ' + BLN[+m-1]; };
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const ls = { get:(k,d)=>{ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set:(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2400); }

/* ============ api ============ */
let CFG = ls.get('cfg', null);
async function api(action, body = {}){
  const r = await fetch(CFG.api, { method:'POST', body: JSON.stringify({ token: CFG.token, action, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'gagal');
  return j.data;
}

/* ============ state ============ */
let S = ls.get('state', null);
let view = 'home', loading = false;
const ui = { calMonth: null, calSel: todayISO(), repTab: null };

const GROUP = n => /paylater/i.test(n) ? 'Paylater'
  : /bibit|tring|rdn|emas/i.test(n) ? 'Investasi'
  : /^cash$/i.test(n) ? 'Tunai'
  : /gopay|shopeepay|dana|ovo|blu/i.test(n) && !/jago/i.test(n) ? 'E-wallet' : 'Bank';
const IC = { Bank:'blue', 'E-wallet':'green', Investasi:'blue', Paylater:'red', Tunai:'' };
const initials = s => String(s).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '•';
const T = r => ({ tab:r[0], row:r[1], date:r[2], desc:r[3], amt:r[4], cf:r[5], cat:r[6], from:r[7], to:r[8] });

function derived(){
  const tx = S.tx.map(T);
  const per = S.periods.find(p => p.tab === S.curTab) || {};
  const acc = S.accounts;
  const sum = g => acc.filter(a => GROUP(a.name) === g).reduce((s,a)=>s+a.balance,0);
  const liquid = sum('Bank') + sum('E-wallet') + sum('Tunai');
  const invest = sum('Investasi'), pay = sum('Paylater');
  const today = todayISO();
  const cur = tx.filter(t => t.tab === S.curTab);
  const spendCur = cur.filter(t => t.cf === 'Spending').reduce((s,t)=>s+t.amt,0);
  const incCur = cur.filter(t => t.cf === 'Income').reduce((s,t)=>s+t.amt,0);
  const spendToday = tx.filter(t => t.date === today && t.cf === 'Spending').reduce((s,t)=>s+t.amt,0);
  const daysLeft = per.end ? Math.max(1, Math.round((new Date(per.end) - new Date(today)) / 864e5) + 1) : 30;
  return { tx, per, liquid, invest, pay, net: liquid + invest + pay, spendCur, incCur, spendToday, daysLeft, today };
}

function billsBetween(fromISO, toISO){
  const out = []; if (!S.bills) return out;
  let d = new Date(fromISO + 'T12:00'); const end = new Date(toISO + 'T12:00');
  while (d <= end){
    S.bills.forEach(b => { if (+b.day === d.getDate()) out.push({ ...b, date: d.toISOString().slice(0,10) }); });
    d = new Date(d.getTime() + 864e5);
  }
  return out;
}

/* ============ render ============ */
function render(){
  if (!CFG) return renderSetup();
  $('#nav').style.display = 'flex';
  document.querySelectorAll('nav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  if (!S) { $('#app').innerHTML = `<div class="top"><div><div class="sub">memuat data…</div><h1>Bels</h1></div></div><div class="card"><div class="empty">sebentar ya, ambil data dari spreadsheet</div></div>`; return; }
  ({ home: vHome, cal: vCal, report: vReport, acc: vAcc })[view]();
  window.scrollTo(0, 0);
}

const refreshIcon = `<button class="iconbtn ${loading?'spin':''}" onclick="load()" aria-label="muat ulang"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button>`;

function txItem(t){
  const out = ['Spending','Invest / Savings','Piutang Baru','Bayar Cicilan / Utang','Financial Goals'].includes(t.cf);
  const isT = t.cf === 'Transfer';
  const sign = isT ? '' : out ? '-' : '+';
  const cls = isT ? '' : out ? '' : 'pos';
  const acct = isT ? (t.from && t.to ? t.from + ' → ' + t.to : (t.from ? 'dari ' + t.from : 'ke ' + t.to)) : (t.from || t.to);
  const lab = t.cf === 'Spending' || t.cf === 'Income' ? t.cat : t.cf;
  const icc = t.cf === 'Spending' ? '' : t.cf === 'Income' ? 'green' : 'blue';
  return `<div class="item" onclick="openTx('${t.tab}',${t.row})"><div class="ic ${icc}">${esc(initials(lab||t.cf))}</div>
    <div class="it-main"><div class="it-t">${esc(t.desc || lab)}</div><div class="it-s">${esc(lab || '')} · ${esc(acct || '')} · ${fdate(t.date)}</div></div>
    <div class="it-v num ${cls}">${sign}${short(t.amt)}</div></div>`;
}

function vHome(){
  const D = derived();
  const bills = billsBetween(D.today, D.per.end || D.today);
  const billSum = bills.filter(b=>!/paylater/i.test(b.name)).reduce((s,b)=>s+(+b.amount||0),0) + Math.max(0, -D.pay);
  const perDay = (D.liquid - billSum) / D.daysLeft;
  const recent = D.tx.filter(t => t.date).sort((a,b)=> b.date.localeCompare(a.date) || b.row - a.row).slice(0, 8);
  const h = new Date().getHours(); const salam = h < 11 ? 'selamat pagi' : h < 15 ? 'selamat siang' : h < 19 ? 'selamat sore' : 'selamat malam';
  $('#app').innerHTML = `
  <div class="top"><div><div class="sub">${salam}</div><h1>Halo, Bel</h1></div>${refreshIcon}</div>
  <div class="card">
    <div class="label">Kekayaan bersih</div>
    <div class="big num">${rp(D.net)}</div>
    <div class="split">
      <div><div class="label">Siap pakai</div><div class="v num">${short(D.liquid)}</div></div>
      <div><div class="label">Investasi</div><div class="v num">${short(D.invest)}</div></div>
      <div><div class="label">Paylater</div><div class="v num ${D.pay<0?'neg':''}">${short(D.pay)}</div></div>
    </div>
  </div>
  <div class="row">
    <div class="card"><div class="label">Keluar hari ini</div><div class="mid num">${rp(D.spendToday)}</div></div>
    <div class="card"><div class="label">Keluar periode ini</div><div class="mid num">${short(D.spendCur)}</div><div class="hint">masuk ${short(D.incCur)}</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="label">Aman dipakai per hari</div><div class="mid num ${perDay<0?'neg':''}">${rp(perDay)}</div></div>
      <span class="pill blue">gajian ${D.daysLeft} hari lagi</span>
    </div>
    <div class="hint">uang siap pakai dikurangi tagihan & paylater, dibagi sisa hari sampai ${fdate(D.per.end)}</div>
  </div>
  ${bills.length ? `<div class="sec"><h2>Tagihan terdekat</h2></div><div class="list">${bills.slice(0,4).map(b=>`
    <div class="item"><div class="ic red">${esc(initials(b.name))}</div><div class="it-main"><div class="it-t">${esc(b.name)}</div><div class="it-s">jatuh tempo ${fdate(b.date)}</div></div><div class="it-v num">${+b.amount? short(+b.amount) : (/paylater/i.test(b.name)? short(Math.abs((S.accounts.find(a=>a.name===b.account)||{}).balance||0)) : '-')}</div></div>`).join('')}</div>` : ''}
  <div class="sec"><h2>Transaksi terakhir</h2><a onclick="go('cal')">lihat semua</a></div>
  <div class="list">${recent.map(txItem).join('') || '<div class="empty">belum ada transaksi</div>'}</div>`;
}

function vCal(){
  const D = derived();
  if (!ui.calMonth) ui.calMonth = D.today.slice(0,7);
  const [y,m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const spendBy = {}; D.tx.forEach(t => { if (t.cf === 'Spending' && t.date.startsWith(ui.calMonth)) spendBy[t.date] = (spendBy[t.date]||0) + t.amt; });
  const mStart = ui.calMonth + '-01', mEnd = ui.calMonth + '-' + String(days).padStart(2,'0');
  const billDays = new Set(billsBetween(mStart, mEnd).map(b => b.date));
  const total = Object.values(spendBy).reduce((s,v)=>s+v,0);

  const dayTx = D.tx.filter(t => t.date === ui.calSel).sort((a,b)=>b.row-a.row);

  </div>

function calShift(n){ const [y,m] = ui.calMonth.split('-').map(Number); const d = new Date(y, m-1+n, 1); ui.calMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); vCal(); }

function vReport(){
  const D = derived();
  const withTx = S.periods.filter(p => D.tx.some(t => t.tab === p.tab));
  if (!ui.repTab) ui.repTab = S.curTab;
  const p = S.periods.find(x => x.tab === ui.repTab) || {};
  const tx = D.tx.filter(t => t.tab === ui.repTab);
  const spend = tx.filter(t => t.cf === 'Spending'), inc = tx.filter(t => t.cf === 'Income');
  const sOut = spend.reduce((s,t)=>s+t.amt,0), sIn = inc.reduce((s,t)=>s+t.amt,0);
  const inv = tx.filter(t=>t.cf==='Invest / Savings').reduce((s,t)=>s+t.amt,0) - tx.filter(t=>t.cf==='Dari Asset / Saving').reduce((s,t)=>s+t.amt,0);
  const byCat = {}; spend.forEach(t => byCat[t.cat] = (byCat[t.cat]||0) + t.amt);
  const B = S.budgets || {};
  const cats = Array.from(new Set(Object.keys(byCat).concat(Object.keys(B).filter(k=>+B[k]>0)))).sort((a,b)=>(byCat[b]||0)-(byCat[a]||0));
  const maxC = Math.max(1, ...Object.values(byCat));
  const last6 = withTx.slice(-6).map(pp => { const tt = D.tx.filter(t=>t.tab===pp.tab);
    return { tab: pp.tab, out: tt.filter(t=>t.cf==='Spending').reduce((s,t)=>s+t.amt,0), inn: tt.filter(t=>t.cf==='Income').reduce((s,t)=>s+t.amt,0) }; });
  const maxT = Math.max(1, ...last6.map(x=>Math.max(x.out,x.inn)));
  $('#app').innerHTML = `
  <div class="top"><div><div class="sub">${fdate(p.start)} – ${fdate(p.end)}</div><h1>Laporan</h1></div>${refreshIcon}</div>
  <div class="hscroll">${withTx.map(pp=>`<button class="chip ${pp.tab===ui.repTab?'on':''}" onclick="ui.repTab='${pp.tab}';vReport()">${BLN[['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(pp.tab)]}</button>`).join('')}</div>
  <div class="card">
    <div class="label">Selisih periode ini</div>
    <div class="big num ${sIn-sOut<0?'neg':''}">${rp(sIn - sOut)}</div>
    <div class="split">
      <div><div class="label">Masuk</div><div class="v num pos">${short(sIn)}</div></div>
      <div><div class="label">Keluar</div><div class="v num">${short(sOut)}</div></div>
      <div><div class="label">Investasi</div><div class="v num">${short(inv)}</div></div>
    </div>
  </div>
  <div class="sec"><h2>Per kategori</h2><a onclick="editBudgets()">atur anggaran</a></div>
  <div class="list">${cats.map(c => { const v = byCat[c]||0, b = +B[c]||0; const pct = b ? Math.min(100, v/b*100) : v/maxC*100;
    return `<div class="item" style="display:block" onclick="catDetail('${esc(c).replace(/'/g,"\\'")}')"><div style="display:flex;justify-content:space-between;gap:10px"><span class="it-t">${esc(c)}</span><span class="it-v num">${rp(v)}</span></div>
      <div class="bar"><i class="${b && v>b?'over':''}" style="width:${pct}%"></i></div>
      ${b?`<div class="it-s" style="margin-top:5px">${v>b?'lewat '+rp(v-b):'sisa '+rp(b-v)} dari anggaran ${short(b)}</div>`:''}</div>`; }).join('') || '<div class="empty">belum ada pengeluaran</div>'}</div>
  <div class="sec"><h2>Tren 6 periode</h2></div>
  <div class="card">
    <div class="trend">${last6.map(x=>`<div class="col"><div class="bars"><i class="in" style="height:${x.inn/maxT*100}%"></i><i style="height:${x.out/maxT*100}%"></i></div><small>${BLN[['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(x.tab)]}</small></div>`).join('')}</div>
    <div class="legend"><span><i style="background:#BFD0F3"></i>masuk</span><span><i style="background:var(--blue)"></i>keluar</span></div>
  </div>`;
}
function catDetail(c){
  const tx = derived().tx.filter(t => t.tab === ui.repTab && t.cf === 'Spending' && t.cat === c).sort((a,b)=>b.date.localeCompare(a.date));

/* ============ sheets / actions ============ */
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function openTx(tab, row){
  const t = derived().tx.find(x => x.tab === tab && x.row === row); if (!t) return;
  openSheet(`<h3>${esc(t.desc || t.cat)}</h3>
    <div class="card"><div class="label">${esc(t.cf)}${t.cat && t.cf!=='Transfer' ? ' · ' + esc(t.cat) : ''}</div><div class="big num">${rp(t.amt)}</div>
    <div class="hint">${fdate(t.date)} · ${esc([t.from, t.to].filter(Boolean).join(' → '))}<br>tab ${t.tab}, baris ${t.row}</div></div>
    <div class="grid2"><button class="btn ghost" onclick="dupTx('${tab}',${row})">duplikat</button><button class="btn danger" onclick="delTx('${tab}',${row})">hapus</button></div>`);
}
async function delTx(tab, row){
  try { $('#sheet').classList.add('loading'); await api('delete', { tab, row }); S.tx = S.tx.filter(r => !(r[0]===tab && r[1]===row));
    closeSheet(); toast('terhapus'); render(); load(true); }
  catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}
function dupTx(tab, row){ const t = derived().tx.find(x => x.tab === tab && x.row === row);
  openAdd({ cashflow:t.cf, category:t.cat, amount:t.amt, from:t.from, to:t.to, description:t.desc, date:todayISO() }); }

function openAcc(name){
  const a = S.accounts.find(x => x.name === name);
  openSheet(`<h3>${esc(name)}</h3>
    <div class="card"><div class="label">Saldo di catatan</div><div class="big num">${rp(a.balance)}</div></div>
    <div class="field"><label>Saldo asli sekarang (lihat di app bank)</label><input id="real" inputmode="numeric" placeholder="0" oninput="fmtInput(this);recon('${esc(name)}')"></div>
    <div id="reconOut"></div>
    <div class="sec" style="margin-top:6px"><h2>Transaksi akun ini</h2></div>
    <div class="list">${derived().tx.filter(t=>t.from===name||t.to===name).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,12).map(txItem).join('')||'<div class="empty">kosong</div>'}</div>`);
}
function recon(name){
  const a = S.accounts.find(x => x.name === name); const real = parseAmt($('#real').value);
  const diff = real - a.balance; const out = $('#reconOut');
  if (!$('#real').value || Math.abs(diff) < 1) { out.innerHTML = $('#real').value ? '<div class="pill blue" style="margin-bottom:12px">sudah cocok 👌</div>' : ''; return; }
  const minus = diff < 0; const cats = minus ? S.lists.spending : S.lists.income;
  const def = minus ? (cats.includes('Makan/minum') ? 'Makan/minum' : cats[0]) : (cats.includes('Others') ? 'Others' : cats[0]);
  out.innerHTML = `<div class="card"><div class="label">Selisih</div><div class="mid num ${minus?'neg':'pos'}">${rp(diff)}</div>
    <div class="hint">${minus ? 'ada pengeluaran yang belum dicatat' : 'ada pemasukan yang belum dicatat'}. catat sebagai:</div>
    <div class="field" style="margin:10px 0 12px"><label>Kategori</label><select id="rcat">${cats.map(c=>`<option ${c===def?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <button class="btn" onclick="saveRecon('${esc(name)}',${diff})">catat selisih</button></div>`;
}
async function saveRecon(name, diff){
  const minus = diff < 0;
  await saveTx({ date: todayISO(), description: (minus ? 'pengeluaran' : 'pemasukan') + ' tidak tercatat (cocokkan saldo)', amount: Math.abs(diff),
    cashflow: minus ? 'Spending' : 'Income', category: $('#rcat').value, from: minus ? name : '', to: minus ? '' : name });
}

function billRow(b={}){ return `<div class="card bill" style="padding:12px"><div class="grid2"><div class="field" style="margin:0"><label>Nama</label><input class="bn" value="${esc(b.name||'')}" placeholder="mis. iCloud"></div>

async function saveBills(){
  const bills = [...document.querySelectorAll('.bill')].map(c => { const name = c.querySelector('.bn').value.trim();
    const acc = S.accounts.find(a => a.name.toLowerCase() === name.toLowerCase());

    .filter(b => b.name && b.day >= 1 && b.day <= 31);
  try { await api('saveSettings', { bills }); S.bills = bills; ls.set('state', S); closeSheet(); toast('tagihan tersimpan'); render(); } catch(e){ toast(e.message); }
}
function resetCfg(){ openSheet(`<h3>Koneksi spreadsheet</h3><div class="hint" style="margin:-6px 0 14px">hanya perlu diubah kalau link Apps Script berganti</div>
  <button class="btn danger" onclick="localStorage.clear();location.reload()">putuskan & atur ulang</button>`); }

/* ============ tambah ============ */
const FORM = { cashflow:'Spending', category:'', amount:0, from:'', to:'', date:'', description:'' };
const OTHER_CF = ['Invest / Savings','Dari Asset / Saving','Piutang Baru','Pelunasan Piutang','Cicilan / Utang Baru','Bayar Cicilan / Utang','Financial Goals'];
const CF_LABEL = { 'Invest / Savings':'Nabung / investasi', 'Dari Asset / Saving':'Ambil dari investasi', 'Piutang Baru':'Kasih pinjaman',
  'Pelunasan Piutang':'Pinjaman dibayar balik', 'Cicilan / Utang Baru':'Ngutang / cicilan baru', 'Bayar Cicilan / Utang':'Bayar utang / cicilan', 'Financial Goals':'Financial goals' };
const needFrom = cf => ['Spending','Transfer','Invest / Savings','Dari Asset / Saving','Piutang Baru','Bayar Cicilan / Utang','Financial Goals'].includes(cf);
const needTo = cf => ['Income','Transfer','Invest / Savings','Dari Asset / Saving','Pelunasan Piutang','Cicilan / Utang Baru'].includes(cf);
const catsFor = cf => cf === 'Spending' ? S.lists.spending : cf === 'Income' ? S.lists.income
  : ['Invest / Savings','Dari Asset / Saving'].includes(cf) ? S.lists.invest : cf === 'Financial Goals' ? S.lists.sinking : null;
const lastAcc = () => ls.get('lastAcc', 'Bank Jago');

function openAdd(pre){
  Object.assign(FORM, { cashflow:'Spending', category:'', amount:0, from:lastAcc(), to:'', date:todayISO(), description:'' }, pre || {});
  drawAdd();
}
function drawAdd(){
  const cf = FORM.cashflow; const seg = cf==='Spending'?0:cf==='Income'?1:cf==='Transfer'?2:3;
  const cats = catsFor(cf); const accs = S.accounts.map(a=>a.name);
  const opt = (sel) => `<option value="">pilih akun</option>` + accs.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
  openSheet(`<h3>Catat transaksi</h3>
    <div class="magic"><textarea id="mtext" rows="1" placeholder="ketik aja: makan bakso 25rb pakai jago" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button onclick="$('#file').click()" aria-label="screenshot"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg></button>
      <button class="go" onclick="magic()" aria-label="isi otomatis"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <div class="seg">${['Keluar','Masuk','Pindah','Lainnya'].map((l,i)=>`<button class="${i===seg?'on':''}" onclick="setCf(${i})">${l}</button>`).join('')}</div>
    ${seg===3?`<div class="field"><label>Jenis</label><select onchange="FORM.cashflow=this.value;FORM.category='';drawAdd()">${OTHER_CF.map(c=>`<option value="${c}" ${c===cf?'selected':''}>${CF_LABEL[c]}</option>`).join('')}</select></div>`:''}
    <div class="amt"><span>Rp</span><input id="famt" inputmode="numeric" placeholder="0" value="${FORM.amount?(+FORM.amount).toLocaleString('id-ID'):''}" oninput="fmtInput(this);FORM.amount=parseAmt(this.value)"></div>
    ${cats ? `<div class="chips">${cats.map(c=>`<button class="chip ${c===FORM.category?'on':''}" onclick="FORM.category='${esc(c).replace(/'/g,"\\'")}';drawAdd()">${esc(c)}</button>`).join('')}</div>`
      : cf==='Transfer' ? '' : `<div class="field"><label>${/Piutang/.test(cf)?'Nama peminjam':'Nama utang / cicilan'}</label><input value="${esc(FORM.category)}" oninput="FORM.category=this.value" placeholder="mis. pinjam yuan"></div>`}
    <div class="${needFrom(cf)&&needTo(cf)?'grid2':''}">
      ${needFrom(cf)?`<div class="field"><label>${cf==='Spending'?'Bayar pakai':'Dari'}</label><select onchange="FORM.from=this.value">${opt(FORM.from)}</select></div>`:''}
      ${needTo(cf)?`<div class="field"><label>${cf==='Income'?'Masuk ke':'Ke'}</label><select onchange="FORM.to=this.value">${opt(FORM.to)}</select></div>`:''}
    </div>
    <div class="grid2">
      <div class="field"><label>Tanggal</label><input type="date" value="${FORM.date}" onchange="FORM.date=this.value"></div>
      <div class="field"><label>Keterangan</label><input value="${esc(FORM.description)}" oninput="FORM.description=this.value" placeholder="mis. bakso basuki"></div>
    </div>
    <button class="btn" id="saveBtn" onclick="submitAdd()">simpan</button>`);
}
function setCf(i){ const map = ['Spending','Income','Transfer', OTHER_CF[0]]; const prev = FORM.cashflow; FORM.cashflow = map[i]; FORM.category='';
  if (map[i]==='Income' && !FORM.to) { FORM.to = FORM.from || lastAcc(); FORM.from=''; }
  if (map[i]==='Spending' && !FORM.from) { FORM.from = FORM.to || lastAcc(); FORM.to=''; }
  if (prev !== FORM.cashflow) drawAdd(); }
function submitAdd(){
  const cf = FORM.cashflow;
  if (!FORM.amount) return toast('isi nominalnya dulu');
  if (catsFor(cf) && !FORM.category) return toast('pilih kategori dulu');
  if (needFrom(cf) && !FORM.from) return toast('pilih akun asal');
  if (needTo(cf) && !FORM.to) return toast('pilih akun tujuan');
  const tx = { ...FORM }; if (!needFrom(cf)) tx.from = ''; if (!needTo(cf)) tx.to = '';
  if (!tx.description) tx.description = tx.category || CF_LABEL[cf] || cf;
  saveTx(tx);
}
async function saveTx(tx){
  const b = $('#saveBtn'); $('#sheet').classList.add('loading');
  try {
    const r = await api('add', { tx });
    if (tx.from) ls.set('lastAcc', tx.from);
    S.tx.push([r.tab, r.row, tx.date, tx.description, +tx.amount, tx.cashflow, tx.cashflow==='Transfer'?' Antar Account':tx.category, tx.from||'', tx.to||'']);
    // update saldo lokal biar langsung kerasa
    S.accounts.forEach(a => { if (a.name === tx.from) { a.balance -= +tx.amount; a.out += +tx.amount; } if (a.name === tx.to) { a.balance += +tx.amount; a.inn += +tx.amount; } });
    ls.set('state', S); closeSheet(); toast('tersimpan ✓ ' + rp(tx.amount)); render(); load(true);
  } catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}

/* isi otomatis: teks / screenshot */
async function magic(){ const text = $('#mtext').value.trim(); if (!text) return toast('ketik dulu ya'); await runParse({ text }); }
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = await shrink(f); await runParse({ image: img, mime: 'image/jpeg' }); };
async function runParse(body){
  $('#sheet').classList.add('loading'); toast('membaca…');
  try { const tx = await api('parse', body); const acc = S.accounts.map(a=>a.name);
    Object.assign(FORM, { cashflow: tx.cashflow || 'Spending', category: tx.category || '', amount: +tx.amount || 0,
      from: acc.includes(tx.from) ? tx.from : (needFrom(tx.cashflow) ? FORM.from : ''), to: acc.includes(tx.to) ? tx.to : '',
      date: tx.date || todayISO(), description: tx.description || '' });
    if (FORM.cashflow==='Transfer') FORM.category=''; drawAdd(); toast('cek dulu, lalu simpan');
  } catch(e){ toast(e.message); } finally { $('#sheet').classList.remove('loading'); }
}
function shrink(file){ return new Promise(res => { const img = new Image(); img.onload = () => { const max = 1280; const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  res(c.toDataURL('image/jpeg', .82).split(',')[1]); }; img.src = URL.createObjectURL(file); }); }

function parseAmt(v){ return +String(v||'').replace(/[^0-9]/g,'') || 0; }
function fmtInput(el){ const n = parseAmt(el.value); el.value = n ? n.toLocaleString('id-ID') : ''; }

/* ============ load ============ */
async function load(silent){
  if (loading) return; loading = true; if (!silent) render();
  try { const d = await api('state'); S = d; ls.set('state', S); }
  catch(e){ toast('gagal sinkron: ' + e.message); }
  loading = false; render();
}
function go(v){ view = v; render(); }
document.querySelectorAll('nav [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#addBtn').onclick = () => S ? openAdd() : toast('tunggu data dimuat');
document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG) load(true); });

/* ============ setup awal ============ */
function renderSetup(){
  $('#nav').style.display = 'none';
  const q = new URLSearchParams(location.search);
  $('#app').innerHTML = `<div class="setup"><img class="logo" src="icon-180.png" alt="">
    <h1 style="font-size:26px;font-weight:700;letter-spacing:-.02em">Sambungkan spreadsheet</h1>
    <p class="hint" style="font-size:14px;margin:8px 0 22px">sekali aja. tempel link Apps Script dan kode akses dari panduan.</p>
    <div class="field"><label>Link Apps Script (…/exec)</label><input id="sApi" value="${esc(q.get('api')||'')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label>Kode akses</label><input id="sTok" value="${esc(q.get('k')||'')}" placeholder="bel-…"></div>
    <button class="btn" style="margin-top:8px" onclick="connect()">sambungkan</button></div>`;
}
async function connect(){
  CFG = { api: $('#sApi').value.trim(), token: $('#sTok').value.trim() };
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.api)) { CFG = null; return toast('link harus diakhiri /exec'); }
  try { toast('menyambungkan…'); const d = await api('state'); S = d; ls.set('cfg', CFG); ls.set('state', S); history.replaceState(null,'',location.pathname); toast('tersambung ✓'); render(); }
  catch(e){ CFG = null; toast('gagal: ' + e.message); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render(); if (CFG) load(true);
</script>
</body>
</html>
